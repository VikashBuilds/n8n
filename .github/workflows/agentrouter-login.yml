name: AgentRouter Daily Login

on:
  schedule:
    # Run daily at 6:30 AM IST (1:00 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  daily-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null 2>&1
          npm install playwright@latest > /dev/null 2>&1
          npx playwright install chromium --with-deps > /dev/null 2>&1
          echo "✅ Playwright + Chromium installed"

      - name: Run Daily Login
        env:
          GH_USER_SESSION: ${{ secrets.GH_USER_SESSION }}
          GH_USER_SESSION_SS: ${{ secrets.GH_USER_SESSION_SS }}
          GH_DOTCOM_USER: ${{ secrets.GH_DOTCOM_USER }}
        run: node scripts/agentrouter-login.mjs

      - name: Upload Screenshots (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-screenshots-${{ github.run_number }}
          path: /tmp/ar_*.png
          retention-days: 3
          if-no-files-found: ignore
