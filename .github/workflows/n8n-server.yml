name: n8n Server (24/7)

on:
  workflow_dispatch:
  schedule:
    # Backup cron — auto-restarts if chain breaks
    - cron: '0 */6 * * *'

# Only 1 instance at a time — new runs queue until current finishes
concurrency:
  group: n8n-server
  cancel-in-progress: false

jobs:
  run-n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ─── Cache n8n installation (8 min → 30 sec) ────────
      - name: Cache n8n
        uses: actions/cache@v4
        id: n8n-cache
        with:
          path: |
            /usr/local/lib/node_modules/n8n
          key: n8n-install-${{ runner.os }}-v1

      - name: Install n8n (skip if cached)
        if: steps.n8n-cache.outputs.cache-hit != 'true'
        run: npm install -g n8n

      - name: Link n8n binary (from cache)
        if: steps.n8n-cache.outputs.cache-hit == 'true'
        run: |
          ln -sf /usr/local/lib/node_modules/n8n/bin/n8n /usr/local/bin/n8n
          echo "✅ n8n restored from cache: $(n8n --version)"

      # ─── Cache cloudflared ──────────────────────────────
      - name: Cache cloudflared
        uses: actions/cache@v4
        id: cf-cache
        with:
          path: /usr/local/bin/cloudflared
          key: cloudflared-linux-amd64-v1

      - name: Install cloudflared (skip if cached)
        if: steps.cf-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      # ─── Start tunnel (fixed URL: n8n.vikashbuilds.in) ──
      - name: Start cloudflared tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "🔗 Starting Cloudflare Tunnel → n8n.vikashbuilds.in"
          cloudflared tunnel run --token "$TUNNEL_TOKEN" &
          sleep 5
          echo "✅ Tunnel connected!"

      # ─── Start n8n with health monitoring ───────────────
      - name: Start n8n and monitor
        env:
          # ─── Core Config ─────────────────────────────────
          N8N_HOST: "0.0.0.0"
          N8N_PORT: "5678"
          N8N_PROTOCOL: "https"
          N8N_PUSH_BACKEND: "sse"
          N8N_EDITOR_BASE_URL: "https://n8n.vikashbuilds.in"
          N8N_WEBHOOK_URL: "https://n8n.vikashbuilds.in/"
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          GENERIC_TIMEZONE: "Asia/Kolkata"
          N8N_ERROR_WORKFLOW_ENABLED: "false"
          N8N_METRICS: "false"
          N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"

          # ─── Future-Proofing (prevent deprecation) ───────
          N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
          N8N_RUNNERS_TASK_TIMEOUT: "300"
          N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
          N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
          N8N_RUNNERS_MODE: "internal"
          N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "false"

          # ─── Database (Aiven PostgreSQL) ─────────────────
          DB_TYPE: "postgresdb"
          DB_POSTGRESDB_HOST: ${{ secrets.DB_POSTGRESDB_HOST }}
          DB_POSTGRESDB_PORT: ${{ secrets.DB_POSTGRESDB_PORT }}
          DB_POSTGRESDB_DATABASE: ${{ secrets.DB_POSTGRESDB_DATABASE }}
          DB_POSTGRESDB_USER: ${{ secrets.DB_POSTGRESDB_USER }}
          DB_POSTGRESDB_PASSWORD: ${{ secrets.DB_POSTGRESDB_PASSWORD }}
          DB_POSTGRESDB_SSL: "true"
          DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"

          # ─── Execution Settings ──────────────────────────
          EXECUTIONS_MODE: "regular"
          EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
          EXECUTIONS_DATA_SAVE_ON_ERROR: "none"
          EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
          EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
          EXECUTIONS_DATA_PRUNE: "true"
          EXECUTIONS_DATA_MAX_AGE: "1"
        run: |
          echo "🚀 Starting n8n..."
          n8n start &
          N8N_PID=$!

          # Wait for n8n to be ready
          echo "⏳ Waiting for n8n..."
          for i in $(seq 1 120); do
            if curl -s http://localhost:5678/healthz > /dev/null 2>&1; then
              echo "✅ n8n is LIVE at https://n8n.vikashbuilds.in"
              break
            fi
            sleep 2
          done

          # ─── Health check loop ───────────────────────────
          # Monitors n8n every 60 sec. If it crashes, auto-restarts.
          RUNTIME=20700  # 5 hours 45 minutes in seconds
          ELAPSED=0
          HEALTH_INTERVAL=60

          while [ $ELAPSED -lt $RUNTIME ]; do
            sleep $HEALTH_INTERVAL
            ELAPSED=$((ELAPSED + HEALTH_INTERVAL))

            # Check if n8n is still alive
            if ! curl -s http://localhost:5678/healthz > /dev/null 2>&1; then
              echo "⚠️  n8n crashed at $(date). Restarting..."
              n8n start &
              N8N_PID=$!
              sleep 30

              if curl -s http://localhost:5678/healthz > /dev/null 2>&1; then
                echo "✅ n8n recovered successfully!"
              else
                echo "❌ n8n failed to restart. Ending run to trigger chain restart."
                break
              fi
            fi

            # Log status every 30 minutes
            if [ $((ELAPSED % 1800)) -eq 0 ]; then
              HOURS=$((ELAPSED / 3600))
              MINS=$(((ELAPSED % 3600) / 60))
              echo "📊 Status: n8n running | Uptime: ${HOURS}h ${MINS}m | $(date)"
            fi
          done

          echo "🔄 Scheduled restart — triggering next run..."
          kill $N8N_PID 2>/dev/null || true

      # ─── Trigger next run (chain continues) ─────────────
      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔄 Triggering next workflow..."
          # Retry up to 3 times in case of API failure
          for attempt in 1 2 3; do
            if gh workflow run n8n-server.yml --repo ${{ github.repository }}; then
              echo "✅ Next run triggered (attempt $attempt)"
              exit 0
            fi
            echo "⚠️  Trigger failed (attempt $attempt), retrying in 10s..."
            sleep 10
          done
          echo "❌ Failed to trigger next run after 3 attempts. Backup cron will restart within 6 hours."
